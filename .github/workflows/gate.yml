name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: vendored kernels are byte-identical to their pinned commits
        run: node tools/vendor.mjs --check
      - name: unit and hostile-input suites
        run: |
          node --test test/*.test.mjs
      - name: the v1 red-team reproduces its receipt byte for byte
        run: node attack-kit/redteam.mjs --check
      - name: the synthetic measurement of the sealed claims reproduces its receipt byte for byte
        run: |
          node measure/measure.mjs --synthetic --check
  witness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel: [bes, entropy, gep, watch, trust, envelope, recovery, drivers, stack, store, judge, cost]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the gate is witness v0.6, byte for byte
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness-v0.6
          cmp /tmp/witness-v0.6/witness.mjs .witness/witness.mjs
          cmp /tmp/witness-v0.6/runner.mjs .witness/runner.mjs
      - name: mutation and fuzz gate, no unreviewed survivors, nothing capped
        run: |
          node witness-all.mjs ${{ matrix.kernel }}
